<!doctype html>
<!-- Source for public/og.png (1200x630): the workbook cover. Regenerate with: node scripts/og/render.mjs -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:"BM Serif";font-weight:500;src:url(../../src/styles/fonts/bm-serif-500.woff2) format("woff2")}
@font-face{font-family:"BM Serif";font-weight:500;font-style:italic;src:url(../../src/styles/fonts/bm-serif-500-italic.woff2) format("woff2")}
@font-face{font-family:"BM Serif";font-weight:700;src:url(../../src/styles/fonts/bm-serif-700.woff2) format("woff2")}
@font-face{font-family:"BM Sans";font-weight:700;src:url(../../src/styles/fonts/bm-sans-700.woff2) format("woff2")}
@font-face{font-family:"BM Typewriter";font-weight:500;src:url(../../src/styles/fonts/bm-typewriter-500.woff2) format("woff2")}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;color:#1B1B1F;
  background-color:#1E4790;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),
    radial-gradient(120% 90% at 30% 20%,transparent 40%,rgba(22,53,110,.65) 100%)}
.spine{position:absolute;inset:0 auto 0 0;width:26px;background:#16356E;box-shadow:2px 0 8px rgba(0,0,0,.25)}
.label{position:absolute;left:150px;top:62px;width:900px;background:#FCFAF4;padding:10px;border-radius:3px;
  box-shadow:0 1px 1px rgba(60,45,20,.12),0 18px 40px -16px rgba(0,0,0,.45)}
.frame{border:2px solid rgba(27,27,31,.75);outline:1px solid rgba(27,27,31,.35);outline-offset:4px;padding:48px 56px 40px;text-align:center}
.kicker{font-family:"BM Serif";font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:26px;color:#1F4E9C}
h1{font-family:"BM Serif";font-weight:700;font-size:118px;line-height:1;margin-top:8px;letter-spacing:-.01em}
.sub{font-family:"BM Serif";font-style:italic;font-size:30px;color:#5E5951;margin-top:14px}
.play{margin-top:30px;display:flex;justify-content:space-between;align-items:center;background:#1B1B1F;color:#F6F1E6;font-family:"BM Sans";font-weight:700;font-size:34px;padding:18px 30px;border-radius:2px}
.play span:last-child{font-family:"BM Typewriter";font-weight:500;font-size:22px;border:1.5px solid rgba(246,241,230,.55);padding:4px 10px}
table{position:absolute;left:150px;width:900px;bottom:22px;table-layout:fixed;border-collapse:collapse;font-family:"BM Typewriter";color:#BCCAE6;font-size:19px}
th{width:52px;font-family:"BM Sans";font-weight:700;letter-spacing:.08em;font-size:15px;color:rgba(246,241,230,.85);text-align:left;padding:3px 0}
td{text-align:center;padding:3px 0;font-size:16px}
tr+tr{border-top:1px solid rgba(246,241,230,.16)}
</style></head><body>
<div class="spine"></div>
<div class="label"><div class="frame">
  <h1>Based Math</h1>
  <div class="sub">Exercises in binary, octal, decimal &amp; hexadecimal, against the clock</div>
  <div class="play"><span>Play</span><span>Enter ↵</span></div>
</div></div>
<table>
  <tr><th>HEX</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>A</td><td>B</td><td>C</td><td>D</td><td>E</td><td>F</td></tr>
  <tr><th>BIN</th><td>0000</td><td>0001</td><td>0010</td><td>0011</td><td>0100</td><td>0101</td><td>0110</td><td>0111</td><td>1000</td><td>1001</td><td>1010</td><td>1011</td><td>1100</td><td>1101</td><td>1110</td><td>1111</td></tr>
</table>
</body></html>
